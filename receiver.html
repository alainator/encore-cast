<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Encore</title>
<!-- Encore's Google Cast receiver. A Cast device (Chromecast, Google TV, SHIELD, a TV with Cast built in) loads this
     page from HTTPS; the Encore Station that cast it sends the party's own TV page address, and the device goes there
     (a party runs on plain http on the local network, which an https page may not talk to, so it hands over instead).
     Only an address ending in /tv (Encore's TV page) on a private network is accepted. Hosted on GitHub Pages; its
     address is the Custom Receiver's URL in the Cast Developer Console. -->
<script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
<style>
  html,body{margin:0;height:100%;background:#0c0a11;color:#fbf8f3;font:600 3vw/1.3 system-ui,sans-serif}
  body{display:grid;place-items:center;text-align:center}
  b{font-size:5vw}.dot{color:#ff6b9a}small{display:block;font-size:1.6vw;opacity:.7;margin-top:1vw}
</style>
</head>
<body>
<div><b>Encore<span class="dot">.</span></b><small id="msg">Waiting for the party…</small></div>
<script>
  const NS = "urn:x-cast:app.encore";
  // a party's TV page on this network: http(s), a private or local address, the path /tv
  function ok(u) {
    let x;
    try { x = new URL(u); } catch (e) { return false; }
    if (!/^https?:$/.test(x.protocol) || x.pathname !== "/tv") return false;
    const h = x.hostname;
    return /^(10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.|100\.(6[4-9]|[7-9]\d|1[01]\d|12[0-7])\.)/.test(h) || /\.(local|lan|home\.arpa)$/.test(h)
      || /^[a-z0-9-]+\.home\.[a-z0-9.-]+$/i.test(h);
  }
  const ctx = cast.framework.CastReceiverContext.getInstance();
  ctx.addCustomMessageListener(NS, function (e) {
    const url = e.data && e.data.url;
    if (!ok(url)) { document.getElementById("msg").textContent = "That isn't an Encore party's address."; return; }
    document.getElementById("msg").textContent = "Joining the party…";
    location.href = url;   // the TV page itself, from the party
  });
  const opts = new cast.framework.CastReceiverOptions();
  opts.disableIdleTimeout = true;
  opts.customNamespaces = { [NS]: cast.framework.system.MessageType.JSON };
  ctx.start(opts);
</script>
</body>
</html>
